name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch test dependencies
        run: npm run deps

      - name: Generate ATC objects and checks registry
        run: node scripts/generate-atc.mjs

      - name: Run linter and tests
        run: npm test

      - name: Verify documentation build
        run: npm run docs:build
EOF