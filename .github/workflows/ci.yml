name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch test dependencies
        run: npm run deps

      - name: Generate ATC objects and rules registry
        run: node scripts/generate-atc.mjs

      - name: Run linter and tests
        run: npm test

      - name: Verify documentation build
        run: npm run docs:build

      - name: Check generated documentation is committed
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --porcelain -- docs
            echo "::error::Generated documentation is out of date. Run 'npm run docs:build' and commit the generated files."
            exit 1
          fi

      - name: Check internal documentation links
        run: npm run docs:check

      - name: Upload documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy Documentation
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
